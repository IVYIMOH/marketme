<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V2 Supabase App</title>
  <style>
    body { font-family: sans-serif; padding: 40px; max-width: 400px; margin: 0 auto; }
    .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
    label { margin-bottom: 5px; font-weight: bold; }
    input { padding: 8px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px; font-size: 16px; background-color: #3ecf8e; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; width: 100%; }
    button:hover { background-color: #36b87d; }
    .oauth-btn { background-color: #4285F4; margin-top: 20px; }
    .oauth-btn:hover { background-color: #357ae8; }
    #status { margin-top: 20px; padding: 10px; border-radius: 4px; display: none; }
    .success { background-color: #e6f7ed; color: #1e6b43; border: 1px solid #a3e2bd; }
    .error { background-color: #fce8e6; color: #c53929; border: 1px solid #f7c0ba; }
  </style>
</head>
<body>

  <h2>Create Account (V2)</h2>
  
  <div class="form-group">
    <label for="email">Email Address</label>
    <input type="email" id="email" placeholder="you@example.com">
  </div>

  <div class="form-group">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••">
  </div>

  <div class="form-group">
    <label for="displayName">Display Name</label>
    <input type="text" id="displayName" placeholder="John Doe">
  </div>

  <button id="signup-btn">Sign Up with Email</button>

  <button id="google-btn" class="oauth-btn">Sign In with Google</button>

  <div id="status"></div>

  <!-- We load our app logic as a module so we can use modern JS imports -->
  <script type="module" src="./app.js"></script>
</body>
</html>
