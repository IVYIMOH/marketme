<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarketMe</title>
  <style>
    body { font-family: sans-serif; padding: 40px; max-width: 400px; margin: 0 auto; }
    /* Beat the `display: flex` on .form-group -- without this, a hidden
       form-group inside a hidden view would still lay itself out. */
    [hidden] { display: none !important; }
    .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
    label { margin-bottom: 5px; font-weight: bold; }
    input { padding: 8px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px; font-size: 16px; background-color: #3ecf8e; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; width: 100%; }
    button:hover { background-color: #36b87d; }
    button:disabled { background-color: #a8ded4; cursor: not-allowed; }
    .secondary { background-color: #6b7280; }
    .secondary:hover { background-color: #4b5563; }
    #tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab { background: none; color: #6b7280; border-bottom: 2px solid transparent; border-radius: 0; margin-top: 0; font-weight: bold; }
    .tab:hover { background: none; color: #111827; }
    .tab[aria-selected="true"] { color: #1e6b43; border-bottom-color: #3ecf8e; }
    #status { margin-top: 20px; padding: 10px; border-radius: 4px; display: none; }
    #status.success { background-color: #e6f7ed; color: #1e6b43; border: 1px solid #a3e2bd; display: block; }
    #status.error { background-color: #fce8e6; color: #c53929; border: 1px solid #f7c0ba; display: block; }
    .meta { color: #6b7280; font-size: 14px; }
    .loading { color: #6b7280; }
  </style>
</head>
<body>

  <!-- Shown until the first auth state resolves, so a signed-in user who
       reloads never flashes the sign-in form before their session restores. -->
  <p id="loading-view" class="loading">Loading&hellip;</p>

  <!-- ---------- SIGNED OUT ---------- -->
  <div id="auth-view" hidden>
    <h2>MarketMe</h2>

    <div id="tabs" role="tablist">
      <button class="tab" id="tab-signin" role="tab" aria-selected="true" aria-controls="signin-form">Sign In</button>
      <button class="tab" id="tab-signup" role="tab" aria-selected="false" aria-controls="signup-form">Create Account</button>
    </div>

    <!-- Real <form> elements so Enter submits, which is what users expect. -->
    <form id="signin-form" role="tabpanel">
      <div class="form-group">
        <label for="signin-email">Email Address</label>
        <input type="email" id="signin-email" autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label for="signin-password">Password</label>
        <input type="password" id="signin-password" autocomplete="current-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
      </div>
      <button type="submit" id="signin-btn">Sign In</button>
    </form>

    <form id="signup-form" role="tabpanel" hidden>
      <div class="form-group">
        <label for="signup-email">Email Address</label>
        <input type="email" id="signup-email" autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" autocomplete="new-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
      </div>
      <div class="form-group">
        <label for="signup-display-name">Display Name</label>
        <input type="text" id="signup-display-name" autocomplete="name" placeholder="John Doe">
      </div>
      <button type="submit" id="signup-btn">Sign Up with Email</button>
    </form>
  </div>

  <!-- ---------- SIGNED IN ---------- -->
  <div id="app-view" hidden>
    <h2>MarketMe</h2>
    <p>Signed in as <strong id="user-email"></strong></p>
    <p class="meta">
      Display name: <span id="user-display-name">&hellip;</span><br>
      Role: <span id="user-role">&hellip;</span>
    </p>
    <button id="signout-btn" class="secondary">Sign Out</button>
  </div>

  <div id="status"></div>

  <!-- We load our app logic as a module so we can use modern JS imports -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
